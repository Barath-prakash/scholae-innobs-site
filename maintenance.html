<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Scholae is under maintenance</title>
    <link rel="shortcut icon" href="/playstore.png" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #1b1030;
        background: radial-gradient(520px 420px at 100% 0%, rgba(13, 148, 136, 0.18), transparent 70%), linear-gradient(160deg, #faf7fd, #f1eaf8); }
      .card { max-width: 460px; background: #fff; border: 1px solid #e8e3f0; border-radius: 24px; padding: 40px 32px;
        box-shadow: 0 2px 4px rgba(27, 16, 48, 0.05), 0 30px 60px -28px rgba(27, 16, 48, 0.35); }
      img { width: 72px; height: 72px; border-radius: 50%; }
      h1 { margin: 18px 0 8px; font-size: 26px; letter-spacing: -0.02em; }
      p { margin: 0 0 8px; color: #4b4560; line-height: 1.6; }
      button { margin-top: 20px; border: 0; border-radius: 14px; padding: 13px 28px; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
        background: linear-gradient(120deg, #4a148c, #7b1fa2); }
      small { display: block; margin-top: 18px; color: #756f8a; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/playstore_round.png" alt="" onerror="this.style.display='none'" />
      <h1>The app is under maintenance</h1>
      <p>We are making Scholae better and will be back shortly.</p>
      <p>Please try again after some time.</p>
      <button type="button" id="retry">Try again</button>
      <small>If this keeps showing, call +91 95004 52761.</small>
    </main>
    <script>
      // "Try again" goes back to the page the person was on (a path of this site only), else to the sign-in page.
      (function () {
        var from = new URLSearchParams(location.search).get('from') || '';
        var target = from.charAt(0) === '/' && from.charAt(1) !== '/' ? from : '/admin/login';
        document.getElementById('retry').addEventListener('click', function () {
          location.replace(target);
        });
      })();
    </script>
  </body>
</html>
